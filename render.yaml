# Render Blueprint: RoleFold API + worker as ONE free web service (Render's free plan has no background workers).
# Database is Neon (free, no card); see docs/DEPLOY-FREE.md. Free web services sleep after 15 min idle and
# their disk is wiped on restart, so uploaded/exported files are short-lived (the database is not).
services:
  - type: web
    name: rolefold-api
    runtime: docker
    plan: free
    region: virginia # next to Neon aws-us-east-1 and Vercel iad1
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    dockerCommand: sh scripts/start-all.sh
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: PSEUDONYM_SALT
        generateValue: true
      - key: AI_KEY_ENCRYPTION_KEY
        generateValue: true # base64 of 256 random bits = the 32-byte AES key secretbox expects
      - key: LLM_MODEL_FAST
        value: gemini-3.5-flash-lite
      - key: LLM_MODEL_WRITER
        value: gemini-3.8-flash
      - key: LLM_MODEL_VERIFIER
        value: gemini-3.5-flash-lite
      - key: OIDC_ISSUER
        value: https://accounts.google.com
      - key: APP_URL
        value: https://rolefold-green.vercel.app
      # Pasted once in the Render dashboard when the Blueprint is created:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WORKER_DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: OIDC_AUDIENCE
        sync: false
