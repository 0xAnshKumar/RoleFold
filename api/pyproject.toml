[project]
name = "hunt-api"
version = "0.1.0"
description = "Hunt API: profile, resume engine, job matching (TRD v4)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "google-genai>=1.0",
  "pyyaml>=6",
  "pypdf>=6.20.0",
  "python-docx>=1.2.0",
  "typst>=0.15.0",
  "pyjwt[crypto]>=2.10",
  "pypdfium2>=5.14.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "testcontainers[postgres]>=4.8",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a real Postgres (testcontainers); skipped when Docker is unavailable",
    "live: calls the real Gemini API; skipped unless RUN_LIVE_LLM=1 (tests/live)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint.isort]
# The local alembic/ migrations dir is not the alembic package.
known-third-party = ["alembic"]
